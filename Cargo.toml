[package]
name = "qfm"
version = "0.1.0"
edition = "2021"
description = "Minimalist file manager: Rust backend + plain Qt Quick QML frontend"
license = "MIT"

[dependencies]
qmetaobject = "0.2.10"
cstr = "0.2"
log = "0.4"
env_logger = "0.11"
zbus = "5"

[profile.release]
opt-level = 2
lto = true
strip = true
